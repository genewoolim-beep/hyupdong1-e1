# ─────────────────────────────────────────────────────────────────────────────
# SVG 스크래치 드로잉 파라미터
#   - Z축 높이(draw/travel/approach)와 TCP·용지 위치는 "추후 설정" 대상이므로
#     여기서 한곳에 모아 쉽게 수정할 수 있게 했다. 실장비 캘리브레이션 후 값을 채우세요.
#   - ros2 launch svg_drawing drawing.launch.py 로 로드되며, 파라미터로 오버라이드 가능.
# ─────────────────────────────────────────────────────────────────────────────
/**:
  ros__parameters:

    # ── 로봇 식별 ──────────────────────────────────────────────
    robot_id: "dsr01"
    robot_model: "m0609"

    # ── 작업 영역(용지) : A5, 원점=좌상단, x→오른쪽(+), y→아래(+) ──
    work_area_width_mm: 148.0     # A5 가로
    work_area_height_mm: 210.0    # A5 세로
    work_area_margin_mm: 5.0      # 가장자리 여백(경로가 테두리에 닿지 않도록)
    center_drawing: true          # 작업 영역 중앙 정렬

    # ── 곡선 샘플링 ────────────────────────────────────────────
    sample_resolution_mm: 0.5     # 곡선을 이 간격(실측 mm)으로 잘라 폴리라인화

    # ── Z축 높이 (로봇 Base Z, mm) — [추후 캘리브레이션 필수] ──
    # 아크릴 표면(스크래치 접촉면)의 Base Z 를 draw_height_mm 로 둔다.
    draw_height_mm: 74.0          # 실제로 긁는 높이(표면 접촉) — 2026-07-21 키보드 측정 실측값
    travel_height_mm: 89.0        # 획과 획 사이 공중 이동 높이(표면+15mm)
    approach_height_mm: 79.0      # 획 시작점 바로 위 접근 높이(표면+5mm, 급강하 방지)

    # ── 용지 원점의 로봇 Base 좌표 (용지 좌상단이 Base 어디에 놓이는지) ──
    # paper(0,0) → Base(paper_origin_x, paper_origin_y). [추후 캘리브레이션 필수]
    paper_origin_x_mm: 350.0
    paper_origin_y_mm: -100.0

    # 용지 x/y 축이 Base 의 어느 축·방향으로 매핑되는지 (설치 방향에 맞춰 수정).
    #   base_X = paper_origin_x + paper_x * paper_x_sign
    #   base_Y = paper_origin_y + paper_y * paper_y_sign
    # 용지 y(아래+)를 Base -Y 로 두는 등 설치에 맞게 부호만 바꾸면 된다.
    paper_x_sign: 1.0
    paper_y_sign: 1.0

    # ── 펜 자세(고정) : 작업 내내 일정 (Rx, Ry, Rz, deg) — [추후 설정] ──
    tool_rx_deg: 180.0
    tool_ry_deg: 0.0
    tool_rz_deg: 0.0

    # ── 속도/가속 ──────────────────────────────────────────────
    draw_vel_mm_s: 40.0           # 긁는 중 이동 속도
    draw_acc_mm_s2: 200.0
    travel_vel_mm_s: 150.0        # 공중 이동 속도
    travel_acc_mm_s2: 600.0
    move_rot_vel_deg_s: 60.0      # 회전 속도(자세 유지라 실질 거의 0)
    move_rot_acc_deg_s2: 180.0

    # ── 스트로크 그리기 방식 ───────────────────────────────────
    #   "movel"  : 점마다 movel — 원본에 가장 충실(느릴 수 있음)
    #   "movesx" : 스트로크를 스플라인 한 번에 — 빠름(곡선은 시각적으로 거의 동일)
    stroke_mode: "movel"
    movesx_chunk: 50              # movesx 모드일 때 한 번에 보낼 최대 점 수
    # movel 모드에서 점 사이를 블렌딩하는 반경(mm). 0이면 매 점 정지(정확하나 느림·덜컹).
    # 값을 키우면 부드럽고 빨라지지만 미세하게 코너를 깎는다(라인아트엔 보통 무해).
    draw_blend_radius_mm: 0.0

    # ── Z축 힘 제어(compliance) — [실장비 권장] ────────────────
    # true 면 획을 그을 때 Z 를 '일정한 힘으로 누르는' 힘제어로 그린다(XY 는 위치제어).
    # 표면이 미세하게 울퉁불퉁하거나 draw_height 가 조금 안 맞아도 접촉이 유지된다.
    # 실장비에서 draw_force_n(누르는 힘)·force_z_sign(방향 부호)은 반드시 튜닝하세요.
    # [주의] 힘제어는 펜던트 payload/TCP 캘리브레이션 후에만 켜세요. 안 하면 실제 힘을
    # 못 읽어 표면에 계속 박힙니다(2026-07-21 실장비에서 확인). 캘리 전엔 위치제어(false) 사용.
    use_force_control: false                       # 위치제어(z=draw_height 고정) — 검증된 방식
    draw_force_n: 2.0                              # 힘제어 ON 시 목표 힘(N). 2N부터 튜닝(5N은 과함)
    compliance_stiffness: [3000.0, 3000.0, 200.0, 200.0, 200.0, 200.0]  # XY딱딱/Z물렁
    force_z_sign: -1.0                             # -1: Base -Z(아래)로 누름 / 설치에 맞춰 조정

    # ── 터치오프(표면 Z 자동 측정) : /touch_off 서비스 ─────────
    # 펜을 천천히 내려 표면 접촉을 감지 → draw_height_mm 자동 갱신.
    probe_start_offset_mm: 30.0                    # 예상 표면보다 이만큼 위에서 하강 시작
    probe_force_n: 5.0                             # 탐침 하강 힘(N)
    probe_contact_force_n: 3.0                     # 이 힘 이상이면 '접촉'으로 판단(N)
    probe_max_travel_mm: 80.0                      # [안전] 이 이상 내려가도 접촉 없으면 중단
    probe_timeout_s: 20.0                          # [안전] 시간 초과 중단
    probe_vel_mm_s: 10.0                           # 탐침 하강 속도(느리게)
    probe_min_descent_mm: 2.0

    # ── 안전/디버그 ────────────────────────────────────────────
    ready_joints_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
    dry_run: false                # true면 로봇을 움직이지 않고 경로만 계산·로그
