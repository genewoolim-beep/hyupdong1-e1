# ─────────────────────────────────────────────────────────────────────────────
# RViz 가상(에뮬레이터) 검증용 데모 파라미터.
#   - m0609 홈 자세(TCP≈Base(368,6,425), 자세 45/180/45) 근처로 맞춰 "도달 가능"을 보장.
#   - 실제 아크릴 드로잉이 아니라, 파이프라인/모션이 맞는지 RViz 에서 눈으로 확인하는 용도.
#   - 실장비에서는 drawing_params.yaml 을 캘리브레이션해서 사용하세요.
# 사용:
#   ros2 launch svg_drawing drawing.launch.py \
#       config:=$(ros2 pkg prefix svg_drawing)/share/svg_drawing/config/sim_demo.yaml
# ─────────────────────────────────────────────────────────────────────────────
/**:
  ros__parameters:
    robot_id: "dsr01"
    robot_model: "m0609"

    # 작은 작업영역(100x100) — 홈 근처라 반드시 닿음
    work_area_width_mm: 100.0
    work_area_height_mm: 100.0
    work_area_margin_mm: 8.0
    center_drawing: true

    # 직선 도형 데모라 거칠게 샘플(빠름)
    sample_resolution_mm: 4.0

    # 홈 근처 도달 가능 높이 (실접촉 아님, RViz 확인용)
    draw_height_mm: 350.0
    approach_height_mm: 365.0
    travel_height_mm: 385.0

    # 용지 좌상단의 Base 좌표: 작업영역 중심(50,50)이 홈 XY(≈368,6)에 오도록
    paper_origin_x_mm: 318.0
    paper_origin_y_mm: -44.0
    paper_x_sign: 1.0
    paper_y_sign: 1.0

    # 고정 자세 = 홈 자세와 동일(반드시 유효)
    tool_rx_deg: 45.0
    tool_ry_deg: 180.0
    tool_rz_deg: 45.0

    draw_vel_mm_s: 120.0
    draw_acc_mm_s2: 400.0
    travel_vel_mm_s: 200.0
    travel_acc_mm_s2: 600.0
    move_rot_vel_deg_s: 60.0
    move_rot_acc_deg_s2: 180.0

    stroke_mode: "movel"
    movesx_chunk: 50
    draw_blend_radius_mm: 0.0
    ready_joints_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]

    # 힘제어: 시뮬 기본은 off(에뮬레이터는 접촉 물리가 없음). 힘제어 코드 경로 테스트만
    # 하려면 true 로 바꿔 실행하면 명령은 정상 수행된다(실제 압력은 시뮬에선 무의미).
    use_force_control: false
    draw_force_n: 5.0
    compliance_stiffness: [3000.0, 3000.0, 200.0, 200.0, 200.0, 200.0]
    force_z_sign: -1.0
    probe_start_offset_mm: 30.0
    probe_force_n: 5.0
    probe_contact_force_n: 3.0
    probe_max_travel_mm: 80.0
    probe_timeout_s: 20.0
    probe_vel_mm_s: 10.0
    probe_min_descent_mm: 2.0
    dry_run: false
