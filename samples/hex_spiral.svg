<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="800" height="800">
  <!-- 육각형 i+1 은 육각형 i 의 변 중점들을 이은 것과 정확히 같다(정육각형의 잘 알려진 성질):
       회전 +30°, 축소 ×cos(30°)=0.8660 매 층. 그래서 새 육각형의 꼭짓점 6개 전부가
       바로 이전 육각형 변 위(중점)에 정확히 닿는다 — 개수를 늘려도 이 규칙만 유지하면 계속 닿음. -->
  <g fill="none" stroke="#1a1a1a">
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(0) scale(1.0000)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(30) scale(0.8660)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(60) scale(0.7500)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(90) scale(0.6495)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(120) scale(0.5625)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(150) scale(0.4871)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(180) scale(0.4219)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(210) scale(0.3654)" />
    <polygon points="100.00,0.00 50.00,86.60 -50.00,86.60 -100.00,0.00 -50.00,-86.60 50.00,-86.60" transform="rotate(240) scale(0.3164)" />
  </g>
</svg>
